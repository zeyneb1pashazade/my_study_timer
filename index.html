<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oxu Timer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="app-header">
    <h1>Oxu Timer</h1>
  </header>

  <!-- Tab düymələri -->
  <nav class="tab-nav">
    <button class="tab-btn active" data-tab="timer">Timer</button>
    <button class="tab-btn" data-tab="calendar">Təqvim</button>
    <button class="tab-btn" data-tab="weekly">Həftəlik cədvəl</button>
    <button class="tab-btn" data-tab="blocks">Bloklar</button>
  </nav>

  <!-- Tab məzmunları -->
  <main class="tab-content-wrapper">

    <section id="timer" class="tab-content active">
      <h2>Timer</h2>
      <p>Timer məzmunu buraya gələcək.</p>
    </section>

    <section id="calendar" class="tab-content">
      <h2>Təqvim</h2>
      <p>Aylıq təqvim buraya gələcək.</p>
    </section>

    <section id="weekly" class="tab-content">
      <h2>Həftəlik cədvəl</h2>
      <p>Həftəlik cədvəl buraya gələcək.</p>
    </section>

    <section id="blocks" class="tab-content">
      <h2>Bloklar</h2>
      <p>Bloklar siyahısı buraya gələcək.</p>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
